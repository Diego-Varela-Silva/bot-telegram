name: Monitor Telegram

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botao "Run workflow" para testar na hora

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar horario da ultima verificacao
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Buscar mensagens e avisar
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          KEYWORDS: ${{ vars.KEYWORDS }}
        run: python check.py

      - name: Salvar horario da verificacao
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
